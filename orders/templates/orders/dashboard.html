<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://js.pusher.com/beams/1.0/push-notifications-cdn.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/apollo-client-browser@1.0.0"></script>
    <script src="https://unpkg.com/graphql-tag@2.12.6"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Tableau de Bord</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Section Statistiques -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <h2 class="text-xl font-semibold mb-4">Statistiques</h2>
                    <div class="space-y-4">
                        <div>
                            <p class="text-gray-600">Commandes aujourd'hui</p>
                            <p id="today-orders" class="text-2xl font-bold">0</p>
                        </div>
                        <div>
                            <p class="text-gray-600">Notifications non lues</p>
                            <p id="unread-notifications" class="text-2xl font-bold">0</p>
                        </div>
                    </div>
                </div>
                
                <!-- Graphique -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">Activité récente</h2>
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
            
            <!-- Section Principale -->
            <div class="lg:col-span-2">
                <!-- Notifications -->
                <div class="bg-white rounded-lg shadow p-6 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">Notifications Récentes</h2>
                        <button id="mark-all-read" class="text-blue-600 hover:text-blue-800 text-sm">Marquer tout comme lu</button>
                    </div>
                    <div id="notifications-list" class="space-y-3">
                        <!-- Les notifications seront chargées ici -->
                        <div class="text-center py-4 text-gray-500">Chargement des notifications...</div>
                    </div>
                </div>
                
                <!-- Commandes -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">Dernières Commandes</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Client</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Montant</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Statut</th>
                                </tr>
                            </thead>
                            <tbody id="orders-list" class="bg-white divide-y divide-gray-200">
                                <!-- Les commandes seront chargées ici -->
                                <tr>
                                    <td colspan="5" class="px-6 py-4 text-center text-gray-500">Chargement des commandes...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration GraphQL
        const API_URL = '/graphql/';
        
        // Configuration Pusher Beams
        const beamsClient = new PusherPushNotifications.Client({
            instanceId: '578cdb56-625d-4b55-810a-71fb27bbef7b'
        });
        
        // Initialiser Pusher Beams
        beamsClient.start()
            .then(() => beamsClient.addDeviceInterest('new_orders'))
            .then(() => console.log('Abonné à new_orders'))
            .catch(console.error);
        
        // Fonction pour exécuter les requêtes GraphQL
        async function fetchGraphQL(query, variables = {}) {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify({
                    query,
                    variables
                })
            });
            return await response.json();
        }
        
     // Charger les commandes
async function loadOrders() {
    const query = `
        query {
            orders {
                id
                creationDate
                totalAmount
                status
                customer {
                    firstName
                    lastName
                    email
                    phone
                }
                deliveryAddress {
                    street
                    city
                    country
                    postalCode
                }
            }
        }
    `;
    
    const result = await fetchGraphQL(query);
    if (result.errors) {
        console.error('Erreur GraphQL:', result.errors);
        return;
    }
    
    const orders = result.data.orders.reverse();

    const ordersList = document.getElementById('orders-list');
    
    if (orders.length === 0) {
        ordersList.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Aucune commande trouvée</td></tr>';
        return;
    }
    
    // Construction du HTML en gardant l'ordre du backend (déjà trié)
    ordersList.innerHTML = orders.map(order => `
        <tr class="hover:bg-gray-50 cursor-pointer" onclick="window.location.href='/orders/${order.id}'">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">#${order.id}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(order.creationDate).toLocaleString()}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.customer.firstName} ${order.customer.lastName}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.totalAmount} TND</td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                    ${order.status === 'COMPLETED' ? 'bg-green-100 text-green-800' : 
                      order.status === 'PENDING' ? 'bg-yellow-100 text-yellow-800' : 
                      'bg-red-100 text-red-800'}">
                    ${order.status}
                </span>
            </td>
        </tr>
    `).join('');
    
    // Mettre à jour les statistiques
    const today = new Date().toISOString().split('T')[0];
    const todayOrders = orders.filter(order => order.creationDate.startsWith(today)).length;
    document.getElementById('today-orders').textContent = todayOrders;
}

// Fonction pour ajouter une nouvelle commande en haut du tableau
function addNewOrder(order) {
    const ordersList = document.getElementById('orders-list');
    
    // Supprimer le message "Aucune commande" si présent
    if (ordersList.firstChild?.textContent?.includes('Aucune commande')) {
        ordersList.innerHTML = '';
    }
    
    // Ajouter la nouvelle commande en première position
    ordersList.insertAdjacentHTML('afterbegin', `
        <tr class="hover:bg-gray-50 cursor-pointer bg-blue-50" onclick="window.location.href='/orders/${order.id}'">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">#${order.id}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(order.creationDate).toLocaleString()}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.customer.firstName} ${order.customer.lastName}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${order.totalAmount} €</td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">
                    ${order.status || 'NOUVEAU'}
                </span>
            </td>
        </tr>
    `);
    
    // Mettre à jour le compteur des commandes du jour
    const today = new Date().toISOString().split('T')[0];
    if (order.creationDate.startsWith(today)) {
        const todayOrders = document.getElementById('today-orders');
        todayOrders.textContent = parseInt(todayOrders.textContent || '0') + 1;
    }
}
// Charger les notifications
async function loadNotifications() {
    const query = `
        query {
            allNotifications(isRead: false) {
                id
                title
                body
                createdAt
                isRead
                order {
                    id
                }
            }
        }
    `;
    
    const result = await fetchGraphQL(query);
    if (result.errors) {
        console.error('Erreur GraphQL:', result.errors);
        return;
    }
    
    const notifications = result.data.allNotifications.reverse();
    const notificationsList = document.getElementById('notifications-list');
    
    if (notifications.length === 0) {
        notificationsList.innerHTML = '<div class="text-center py-4 text-gray-500">Aucune notification non lue</div>';
        document.getElementById('unread-notifications').textContent = '0';
        return;
    }
    
    // Construction du HTML en gardant l'ordre du backend (déjà trié)
    notificationsList.innerHTML = notifications.map(notification => `
        <div class="p-3 border rounded-lg ${notification.isRead ? 'bg-gray-50' : 'bg-blue-50 border-blue-200'}">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-medium">${notification.title}</h3>
                    <p class="text-sm text-gray-600">${notification.body}</p>
                    <p class="text-xs text-gray-500 mt-1">${new Date(notification.createdAt).toLocaleString()}</p>
                </div>
                <button onclick="markNotificationAsRead('${notification.id}')" class="text-sm ${notification.isRead ? 'text-gray-400' : 'text-blue-600 hover:text-blue-800'}">
                    ${notification.isRead ? 'Lu' : 'Marquer comme lu'}
                </button>
            </div>
            ${notification.order ? `<a href="/orders/${notification.order.id}" class="text-sm text-blue-600 hover:underline mt-2 inline-block">Voir la commande</a>` : ''}
        </div>
    `).join('');
    
    document.getElementById('unread-notifications').textContent = notifications.length;
}

// Fonction pour ajouter une nouvelle notification en haut de la liste
function addNewNotification(notification) {
    const notificationsList = document.getElementById('notifications-list');
    
    // Supprimer le message "Aucune notification" si présent
    if (notificationsList.firstChild?.classList?.contains('text-center')) {
        notificationsList.innerHTML = '';
    }
    
    // Ajouter la nouvelle notification en première position
    notificationsList.insertAdjacentHTML('afterbegin', `
        <div class="p-3 border rounded-lg bg-blue-50 border-blue-200">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="font-medium">${notification.title}</h3>
                    <p class="text-sm text-gray-600">${notification.body}</p>
                    <p class="text-xs text-gray-500 mt-1">${new Date().toLocaleString()}</p>
                </div>
                <button onclick="markNotificationAsRead('${notification.id}')" class="text-sm text-blue-600 hover:text-blue-800">
                    Marquer comme lu
                </button>
            </div>
            ${notification.orderId ? `<a href="/orders/${notification.orderId}" class="text-sm text-blue-600 hover:underline mt-2 inline-block">Voir la commande</a>` : ''}
        </div>
    `);
    
    // Mettre à jour le compteur
    const unreadCount = document.getElementById('unread-notifications');
    unreadCount.textContent = parseInt(unreadCount.textContent || '0') + 1;
}
        
        // Marquer une notification comme lue
        async function markNotificationAsRead(notificationId) {
            const mutation = `
                mutation MarkNotificationAsRead($id: ID!) {
                    markNotificationAsRead(id: $id) {
                        notification {
                            id
                            isRead
                        }
                    }
                }
            `;
            
            await fetchGraphQL(mutation, { id: notificationId });
            loadNotifications();
        }
        
        // Marquer toutes les notifications comme lues
        document.getElementById('mark-all-read').addEventListener('click', async () => {
            const mutation = `
                mutation MarkAllNotificationsAsRead {
                    markAllNotificationsAsRead {
                        count
                    }
                }
            `;
            
            await fetchGraphQL(mutation);
            loadNotifications();
        });
        
        // Initialiser le graphique
        function initChart() {
            const ctx = document.getElementById('activityChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                    datasets: [{
                        label: 'Commandes',
                        data: [12, 19, 3, 5, 2, 3, 7],
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
       // Écouter les nouvelles notifications en temps réel
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'NEW_NOTIFICATION') {
            // Afficher une notification toast
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg';
            toast.innerHTML = `
                <h3 class="font-bold">${event.data.notification.title}</h3>
                <p>${event.data.notification.body}</p>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
            
            // Ajouter la nouvelle notification et commande
            addNewNotification({
                title: event.data.notification.title,
                body: event.data.notification.body,
                id: 'notif_' + Date.now(),
                orderId: event.data.data?.order_id,
                isRead: false,
                createdAt: new Date().toISOString()
            });
            
            // Si la notification contient une commande, l'ajouter aussi
            if (event.data.data?.order_id) {
                // Vous devrez peut-être récupérer les détails complets de la commande
                // via une requête GraphQL supplémentaire ici
            }
        }
    });
}
        // Charger les données initiales
        document.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            loadNotifications();
            initChart();
        });
    </script>
</body>
</html>
